<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노량진 시세 추이</title>
<style>
:root{
  --surface-1:#fcfcfb; --surface-2:#f2f2ef; --line:#e2e1dc;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7b7a75;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --accent:#2f6db3; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --surface-1:#1a1a19; --surface-2:#232322; --line:#3a3a38;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96958c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#6ea8e8; color-scheme:dark;} }
:root[data-theme="dark"]{
  --surface-1:#1a1a19; --surface-2:#232322; --line:#3a3a38;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96958c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --accent:#6ea8e8; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-1);color:var(--text-primary);
  font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.top{height:3px;background:var(--accent)}
header{padding:18px 24px 4px}
h1{margin:0;font-size:19px;font-weight:650}
.sub{color:var(--text-secondary);font-size:13px;margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px 6px;align-items:center}
.picker{display:none;padding:10px 16px 2px}
.picker select{width:100%;font-size:16px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text-primary)}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--text-secondary);
  border-radius:14px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:4px 24px 40px;max-width:1120px}
figure{margin:0}     /* UA 기본 margin 40px 이 그래프 폭을 먹는다 */
figcaption{font-size:16px;font-weight:650;margin:6px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:2px 0 4px;
  font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sep{color:var(--line)}
.legend svg{width:14px;height:14px;flex:none}
.tip svg{width:14px;height:14px;flex:none}
svg{width:100%;height:auto;display:block;touch-action:none}
.note{font-size:12.5px;color:var(--text-muted);margin:8px 0 0;white-space:pre-line}
.tip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.13);
  opacity:0;transition:opacity .08s;max-width:340px;z-index:9}
.tip .row{display:flex;gap:6px;align-items:center;margin-top:3px}
.tip .sub{color:var(--text-muted);font-size:11.5px;margin:1px 0 0 22px}
table{border-collapse:collapse;font-size:12.5px;margin-top:10px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
th{color:var(--text-secondary);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.toggle{border:1px solid var(--line);background:var(--surface-2);color:var(--text-secondary);
  border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;margin-top:12px}
@media (max-width:640px){
  header{padding:12px 16px 2px} h1{font-size:17px} .sub{font-size:12px}
  main{padding:4px 12px 32px} .controls{display:none} .picker{display:block}
  figcaption{font-size:15px} .legend{gap:10px;font-size:12px;margin-bottom:2px}
  .note{font-size:11.5px} .tip{max-width:min(92vw,340px);font-size:12px}
  table{font-size:11.5px} th,td{padding:3px 5px}
  .toggle{font-size:13px;padding:7px 12px}
}
</style></head>

  return el("polygon",{points:`${x},${y-r-1} ${x+r+1},${y+r} ${x-r-1},${y+r}`,...a});
}
function legendMark(shape,color,hollow){
  const s=el("svg",{width:14,height:14,viewBox:"0 0 14 14"});
  s.appendChild(mark(7,7,shape,color,hollow,4.5)); return s;
}

const chips=document.getElementById("chips");
DATA.forEach((s,i)=>{const b=document.createElement("button");
  b.className="chip";b.type="button";b.setAttribute("aria-pressed",i===0);
  b.textContent=s.item;
  b.onclick=()=>{cur=i;pick.value=i;
    [...chips.children].forEach((c,j)=>c.setAttribute("aria-pressed",j===i));draw();};
  chips.appendChild(b);});
const pick=document.getElementById("pick");
DATA.forEach((s,i)=>{const o=document.createElement("option");
  o.value=i; o.textContent=s.item; pick.appendChild(o);});
pick.onchange=()=>{cur=+pick.value;
  [...chips.children].forEach((c,j)=>c.setAttribute("aria-pressed",j===cur)); draw();};
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
document.getElementById("sub").textContent=
  DATES[0]+" ~ "+DATES[DATES.length-1]+" · "+DATA.length+"개 어종 · 가게 "+SHOPS.join(", ");

const GAP=3;
let W=900,H=400,M={t:30,r:150,b:38,l:64},MOBILE=false;
function layout(){
  const box=document.getElementById("chart").parentElement.getBoundingClientRect();
  W=Math.max(300,Math.round(box.width));
  MOBILE=W<640;
  H=MOBILE?Math.round(Math.min(420,Math.max(300,W*0.95))):400;
  // 폰에서는 오른쪽 직접 라벨을 뺀다 - 좁은 화면에서 그래프를 절반이나 먹는다
  M=MOBILE?{t:26,r:14,b:34,l:52}:{t:30,r:150,b:38,l:64};
  const svg=document.getElementById("chart");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.style.height=H+"px";       // CSS 의 height:auto 를 이기려면 인라인 스타일이어야 한다
}
function draw(){
  layout();
  const s=DATA[cur],svg=document.getElementById("chart");svg.textContent="";
  document.getElementById("tip").style.opacity=0;   // 어종을 바꾸면 이전 tooltip 은 지운다
  document.getElementById("cap").textContent=s.item;
  const lines=s.lines, pts=[].concat(...lines.map(l=>l.pts));
  const iw=W-M.l-M.r, ih=H-M.t-M.b;
  const xs=d=>M.l+DATES.indexOf(d)*(iw/Math.max(1,DATES.length-1));
  let lo=Math.min(...pts.map(p=>p.lo)), hi=Math.max(...pts.map(p=>p.hi));
  const pad=(hi-lo)*0.15||hi*0.1; lo=Math.max(0,lo-pad); hi+=pad;
  const stp=Math.pow(10,Math.floor(Math.log10((hi-lo)/4)));
  const tick=[1,2,2.5,5,10].map(m=>m*stp).find(v=>(hi-lo)/v<=5)||stp;
  const y0=Math.floor(lo/tick)*tick,y1=Math.ceil(hi/tick)*tick;
  const ys=v=>M.t+ih-(v-y0)/(y1-y0)*ih;

  for(let v=y0;v<=y1+1e-6;v+=tick){
    svg.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:ys(v),y2:ys(v),stroke:"var(--line)","stroke-width":1}));
    const t=el("text",{x:M.l-8,y:ys(v)+4,"text-anchor":"end",fill:"var(--text-muted)","font-size":11});
    t.textContent=won(v); svg.appendChild(t);
  }
  const yl=el("text",{x:4,y:M.t-12,fill:"var(--text-muted)","font-size":11});
  yl.textContent="원/"+s.unit; svg.appendChild(yl);
  const every=Math.ceil(DATES.length/(MOBILE?5:9));
  DATES.forEach((d,i)=>{if(i%every)return;
    const t=el("text",{x:xs(d),y:H-M.b+16,"text-anchor":"middle",fill:"var(--text-muted)","font-size":11});
    t.textContent=d.slice(5).replace("-","/");svg.appendChild(t);});

  const ends=[];
  const multiOrigin=new Set(lines.map(l=>l.origin)).size>1;
  lines.forEach(L=>{
    const c=COLOR[L.shop], sh=SHAPE[L.origin]||"circle";
    const dash=multiOrigin?(DASH[L.origin]||""):"";
    const thin=L.rank>0, lw=thin?1.5:2.4, mr=thin?2.8:3.6;  // 2번·3번(작은 것)은 가늘게
    let seg=[];
    const flush=()=>{if(seg.length>1){const a={d:"M"+seg.map(p=>xs(p.d)+" "+ys(p.p)).join("L"),
      fill:"none",stroke:c,"stroke-width":2,"stroke-linejoin":"round",opacity:.9};
      if(dash)a["stroke-dasharray"]=dash; svg.appendChild(el("path",a));} seg=[];};
    L.pts.forEach((p,i)=>{ if(i&&DATES.indexOf(p.d)-DATES.indexOf(L.pts[i-1].d)>GAP) flush();
      seg.push(p); });
    flush();
    L.pts.forEach(p=>{
      svg.appendChild(mark(xs(p.d),ys(p.p),sh,c,L.wild,mr));
      // 규격이 평소와 많이 다른 날: 옅은 테두리만 두고 숫자는 tooltip 에서 본다
      if(p.flag)
        svg.appendChild(el("circle",{cx:xs(p.d),cy:ys(p.p),r:6.5,fill:"none",
          stroke:c,"stroke-width":1,opacity:.45}));
    });
    const last=L.pts[L.pts.length-1];
    ends.push({L,x:xs(last.d)+18,y:ys(last.p)+4,c,sh,mx:xs(last.d)+9});
  });
  ends.sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<12) ends[i].y=ends[i-1].y+12;
  // 끝 라벨이 규격 라벨과 겹치면 아래로 비킨다(규격 라벨을 먼저 배치했다)

  // 끝 라벨은 그 선을 구분해주는 것만 적는다. 원산지가 하나뿐인 차트에서
  // "일본산"을 세 번 적으면 정보가 0이므로 그때는 가게 이름을 적는다.
  const variants=new Set(lines.map(l=>[l.origin,l.wild?"자연산":"",l.region]
    .filter(Boolean).join(" ")));
  // 같은 글씨(예: "국내산 제주 1번")가 가게별로 여러 번 나오므로 색 표식을 앞에 둔다.
  // 글씨 자체에 색을 입히지 않는 것은 색맹 대비 - 표식이 정체성을 진다.
  if(!MOBILE) ends.forEach(e=>{
    svg.appendChild(mark(e.mx,e.y-3.5,e.sh,e.c,e.L.wild,3));
    const t=el("text",{x:e.x,y:e.y,fill:"var(--text-secondary)","font-size":10.5});
    const desc=[e.L.origin,e.L.wild?"자연산":"",e.L.region].filter(Boolean).join(" ");
    const rk=e.L.nranks>1? " "+(e.L.rank+1)+"번":"";
    t.textContent = (variants.size>1 ? desc : e.L.shop)+rk;
    svg.appendChild(t);});

  const lg=document.getElementById("legend"); lg.textContent="";
  const usedShops=[...new Set(lines.map(l=>l.shop))];
  usedShops.forEach(sh=>{const w=document.createElement("span");
    const k=document.createElement("span");k.style.cssText=
      `width:18px;height:2px;border-radius:1px;background:${COLOR[sh]};display:inline-block`;
    w.append(k,document.createTextNode(sh)); lg.appendChild(w);});
  const sep=document.createElement("span"); sep.className="sep"; sep.textContent="|"; lg.appendChild(sep);
  [...new Set(lines.map(l=>l.origin))].forEach(o=>{const w=document.createElement("span");
    w.appendChild(legendMark(SHAPE[o]||"circle","var(--text-secondary)",false));
    w.appendChild(document.createTextNode(o)); lg.appendChild(w);});
  if(lines.some(l=>l.wild)){const w=document.createElement("span");
    w.appendChild(legendMark("circle","var(--text-secondary)",true));
    w.appendChild(document.createTextNode("자연산(속 빈 표시)")); lg.appendChild(w);}

  const typ=Object.entries(s.kinds||{}).map(([k,v])=>k+" "+v+s.unit);
  // 폰에서는 계열별 평소 규격 나열이 화면을 반쯤 먹는다 - tooltip 에 있으니 생략
  document.getElementById("note").textContent=
    ((typ.length && !MOBILE)? "평소 규격 — "+typ.join(" · ")+"\n":"")
    + "점 = 매물 하나 (같은 날 규격이 다르면 따로 찍는다. 굵은 선 = 큰 것, 얇은 선 = 작은 것)"
    + " · 옅은 테두리가 있는 점은 평소보다 25% 이상 크거나 작은 규격 - 점 위에 커서를 올리면"
    + " 그날 규격과 평소 대비 %가 나온다 · 입고가 3일 넘게 빈 구간은 선을 잇지 않음";

  const hair=el("line",{y1:M.t,y2:M.t+ih,stroke:"var(--text-muted)","stroke-width":1,opacity:0});
  svg.appendChild(hair);
  const tip=document.getElementById("tip");
  svg.onpointerleave=ev=>{ if(!ev||ev.pointerType==="mouse"){
    tip.style.opacity=0; hair.setAttribute("opacity",0);} };
  svg.onpointerdown=ev=>svg.onpointermove(ev);      // 터치: 누른 지점으로 바로 이동
  svg.onpointermove=ev=>{
    const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W;
    let i=Math.round((x-M.l)/(iw/Math.max(1,DATES.length-1)));
    i=Math.max(0,Math.min(DATES.length-1,i));
    const d=DATES[i]; hair.setAttribute("x1",xs(d)); hair.setAttribute("x2",xs(d));
    hair.setAttribute("opacity",.5);
    tip.textContent="";
    const h=document.createElement("b"); h.textContent=d+" · "+s.item; tip.appendChild(h);
    let any=false;
    lines.forEach(L=>{const p=L.pts.find(q=>q.d===d); if(!p)return; any=true;
      const row=document.createElement("div"); row.className="row";
      const k=legendMark(SHAPE[L.origin]||"circle",COLOR[L.shop],L.wild);
      const v=document.createElement("b"); v.textContent=won(p.p)+"원";
      const n=document.createElement("span"); n.style.color="var(--text-muted)";
      n.textContent=L.label+(p.sold?" · 마감":"");
      row.append(k,v,n); tip.appendChild(row);
      if(p.size){ const sz=document.createElement("div"); sz.className="sub";
        const mark2=p.flag==="big"?"▲ ":p.flag==="small"?"▼ ":"";
        sz.textContent=mark2+"규격 "+p.size+s.unit
          +(L.typical? " · 평소 "+L.typical+s.unit:"")
          +(p.dev!=null? " ("+(p.dev>0?"+":"")+Math.round(p.dev)+"%)":"");
        if(p.flag) sz.style.color="var(--text-primary)";
        tip.appendChild(sz); }
      p.list.forEach(L2=>{const sd=document.createElement("div"); sd.className="sub";
        sd.textContent=[L2.v,L2.s,won(L2.p)+"원"+(L2.so?" 마감":"")].filter(Boolean).join(" · ");
        tip.appendChild(sd);});});
    if(!any){const e2=document.createElement("div");e2.className="sub";
      e2.textContent="이 날은 입고 없음";tip.appendChild(e2);}
    tip.style.opacity=1;
    tip.style.left="0px"; tip.style.top="0px";       // 재배치 전에 크기를 잰다
    const tb=tip.getBoundingClientRect();
    let lx=ev.clientX+14, ty=ev.clientY+14;
    if(lx+tb.width>window.innerWidth-8) lx=Math.max(8,ev.clientX-tb.width-14);
    if(ty+tb.height>window.innerHeight-8) ty=Math.max(8,ev.clientY-tb.height-14);
    tip.style.left=lx+"px"; tip.style.top=ty+"px";
  };
  buildTable(s);
}

function buildTable(s){
  const wrap=document.getElementById("tableWrap"); wrap.textContent="";
  const t=document.createElement("table"); const hr=document.createElement("tr");
  ["날짜","가게","원산지","구분","가격(원)","규격","평소 규격","편차","비고"].forEach(h=>{
    const th=document.createElement("th"); th.textContent=h; hr.appendChild(th);});
  t.appendChild(hr);
  const all=[];
  s.lines.forEach(L=>L.pts.forEach(p=>p.list.forEach(
    x=>all.push({d:p.d,L,x,f:p.flag,size:p.size,dev:p.dev}))));
  all.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  all.forEach(r=>{
    const tr=document.createElement("tr");
    [r.d,r.L.shop,r.L.origin,[r.L.wild?"자연산":"",r.L.region].filter(Boolean).join(" ")]
      .forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    const tp=document.createElement("td"); tp.className="num"; tp.textContent=won(r.x.p); tr.appendChild(tp);
    const ts=document.createElement("td"); ts.textContent=r.x.s||"-"; tr.appendChild(ts);
    const tt=document.createElement("td");
    tt.textContent=r.L.typical? r.L.typical+s.unit : "-"; tr.appendChild(tt);
    const td2=document.createElement("td"); td2.className="num";
    td2.textContent=r.dev!=null? (r.dev>0?"+":"")+Math.round(r.dev)+"%" : "-";
    tr.appendChild(td2);
    const tn=document.createElement("td");
    tn.textContent=[r.x.v,r.x.so?"마감":"",r.f==="big"?"평소보다 큼":r.f==="small"?"평소보다 작음":""]
      .filter(Boolean).join(" · ");
    tr.appendChild(tn); t.appendChild(tr);});
  wrap.appendChild(t);
}
document.getElementById("tbtn").onclick=e=>{
  const w=document.getElementById("tableWrap"),open=w.hidden;
  w.hidden=!open; e.target.setAttribute("aria-expanded",open);
  e.target.textContent=open?"표 닫기":"표로 보기";};
addEventListener("pointerdown",ev=>{
  if(!ev.target.closest("#chart")){
    document.getElementById("tip").style.opacity=0;
    const h=document.querySelector("#chart line[stroke='var(--text-muted)']");
    if(h) h.setAttribute("opacity",0);}
}, true);
draw();
</script></body></html>

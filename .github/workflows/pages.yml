# Pages 배포. Source 가 "GitHub Actions" 로 설정된 경우에 이 워크플로가 사이트를 올린다.
# ("Deploy from a branch" 로 설정돼 있으면 GitHub 이 알아서 올리므로 이 파일은 놀고 있는다.)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
